<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Space Radial -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1e38"/>
      <stop offset="70%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#02060d"/>
    </radialGradient>

    <!-- Earth Globe Radial -->
    <radialGradient id="earthGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#03487a"/>
      <stop offset="100%" stop-color="#021f38"/>
    </radialGradient>

    <!-- Atmosphere Glow -->
    <filter id="atmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Orbit 1A Gradient (ISS Cyan) -->
    <linearGradient id="orbit1A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Orbit 1B Gradient (Tiangong Amber) -->
    <linearGradient id="orbit1B" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Orbit 1C Polar Gradient (ISRO Emerald / Tricolor) -->
    <linearGradient id="orbit1C" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#138808" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Base Badge Outer Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#spaceGlow)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>
  
  <!-- Outer Tech Radar Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>

  <!-- Orbit Path 1C: ISRO Polar Orbit (Steep Inclination ~97°) -->
  <ellipse cx="64" cy="64" rx="20" ry="46" fill="none" stroke="url(#orbit1C)" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-15 64 64)"/>

  <!-- Orbit Path 1B: Tiangong Orbit (~41° Inclination) -->
  <ellipse cx="64" cy="64" rx="46" ry="22" fill="none" stroke="url(#orbit1B)" stroke-width="2" stroke-dasharray="5 5" transform="rotate(-30 64 64)"/>

  <!-- Orbit Path 1A: ISS Orbit (~51° Inclination) -->
  <ellipse cx="64" cy="64" rx="47" ry="24" fill="none" stroke="url(#orbit1A)" stroke-width="2.5" stroke-dasharray="7 3" transform="rotate(28 64 64)"/>

  <!-- Earth Atmosphere Outer Halo -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.3" filter="url(#atmGlow)"/>

  <!-- Earth Globe Core -->
  <circle cx="64" cy="64" r="25" fill="url(#earthGrad)"/>

  <!-- Earth Coordinate Lat/Long Grid Curves -->
  <ellipse cx="64" cy="64" rx="24" ry="12" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8"/>
  <ellipse cx="64" cy="64" rx="24" ry="20" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.7"/>
  <line x1="64" y1="39" x2="64" y2="89" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8"/>
  <line x1="39" y1="64" x2="89" y2="64" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1"/>

  <!-- Stylized Continents on Earth (Silhouette) -->
  <path d="M 52,50 Q 56,47 62,51 Q 67,54 64,60 Q 61,64 57,63 Q 50,61 52,50 Z" fill="rgba(16, 185, 129, 0.7)"/>
  <path d="M 68,58 Q 72,56 75,61 Q 74,67 69,66 Q 66,63 68,58 Z" fill="rgba(16, 185, 129, 0.65)"/>
  <path d="M 61,67 Q 65,65 67,71 Q 64,78 60,76 Q 58,72 61,67 Z" fill="rgba(16, 185, 129, 0.6)"/>

  <!-- Satellite 1A: ISS Icon on Cyan Orbit -->
  <g transform="translate(98, 48) rotate(25)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="4.5" fill="#00f0ff"/>
    <rect x="-8" y="-1.5" width="4" height="3" fill="#38bdf8" rx="0.5"/>
    <rect x="4" y="-1.5" width="4" height="3" fill="#38bdf8" rx="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Satellite 1B: Tiangong Icon on Amber Orbit -->
  <g transform="translate(28, 42) rotate(-35)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    <rect x="-7" y="-1.2" width="3.5" height="2.4" fill="#f59e0b" rx="0.5"/>
    <rect x="3.5" y="-1.2" width="3.5" height="2.4" fill="#f59e0b" rx="0.5"/>
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Satellite 1C: ISRO Cartosat-3 on Polar Orbit (Top Apex) -->
  <g transform="translate(58, 20) rotate(-15)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="4" fill="#10b981"/>
    <!-- Tiny Tricolor Solar Wing -->
    <rect x="-6" y="-1.2" width="3" height="2.4" fill="#ff9933" rx="0.5"/>
    <rect x="3" y="-1.2" width="3" height="2.4" fill="#138808" rx="0.5"/>
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Telemetry Pulse Wave Signals -->
  <circle cx="64" cy="64" r="33" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" opacity="0.6"/>
  <circle cx="64" cy="64" r="3" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
