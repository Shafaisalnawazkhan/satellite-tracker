<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favEarth" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#03487a"/>
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#070d19" stroke="#00f0ff" stroke-width="2"/>
  
  <!-- Earth -->
  <circle cx="32" cy="32" r="14" fill="url(#favEarth)"/>
  <ellipse cx="32" cy="32" rx="13" ry="6" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="1.5" fill="#fff"/>

  <!-- Orbits -->
  <ellipse cx="32" cy="32" rx="24" ry="11" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(28 32 32)"/>
  <ellipse cx="32" cy="32" rx="10" ry="24" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 3" transform="rotate(-15 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="10" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 3" transform="rotate(-35 32 32)"/>

  <!-- Satellite Nodes -->
  <circle cx="51" cy="24" r="3" fill="#00f0ff"/>
  <circle cx="28" cy="9" r="2.8" fill="#10b981"/>
  <circle cx="14" cy="21" r="2.6" fill="#fbbf24"/>
</svg>
